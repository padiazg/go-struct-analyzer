# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy && go mod download

builds:
  - id: gsa-lsp
    main: ./cmd/gsa-lsp
    binary: gsa-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/padiazg/go-struct-analyzer/v2/internal/version.Version={{.Version}}
      - -X github.com/padiazg/go-struct-analyzer/v2/internal/version.Commit={{.Commit}}
      - -X github.com/padiazg/go-struct-analyzer/v2/internal/version.BuildDate={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Enhancements'
      regexp: '^.*?enhance(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: padiazg
    name: go-struct-analyzer
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## go-struct-analyzer {{ .Tag }}

    Go struct field alignment analyzer with exact `fieldalignment` parity.
    Ships as CLI (`gsa-lsp analyze`) and LSP server (`gsa-lsp lsp`) for
    editor integration.

    Full documentation: https://padiazg.github.io/go-struct-analyzer

    ### Quick Start

    1. Install & verify the LSP server:
       ```shell
       go install github.com/padiazg/go-struct-analyzer/v2/cmd/gsa-lsp@{{ .Tag }}
       gsa-lsp analyze struct.go            # CLI analysis
       gsa-lsp lsp                          # LSP mode (stdin/stdout)
       ```

    2. VS Code: install "Go Struct Analyzer" from the
       [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=padiazg.go-struct-analyzer)
       or [Open VSX](https://open-vsx.org/extension/padiazg/go-struct-analyzer).

    3. Other LSP editors (Neovim, Helix, etc.): configure `gsa-lsp lsp`
       as a language server — see docs for setup guides.

  footer: |
    **Full Changelog**: https://github.com/padiazg/go-struct-analyzer/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Docs**: https://padiazg.github.io/go-struct-analyzer

    ---