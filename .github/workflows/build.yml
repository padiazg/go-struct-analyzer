name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Build Go LSP server
      run: cd lsp && go build -o ../gsa-lsp ./cmd/gsa-lsp/ && ls -l ./cmd/gsa-lsp/
    - name: Verify binary
      run: chmod +x gsa-lsp && ./gsa-lsp version
    - name: Upload Go binary
      uses: actions/upload-artifact@v4
      with:
        name: gsa-lsp-linux-amd64
        path: gsa-lsp
        retention-days: 1

  build-vsix:
    needs: build-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
    - name: Download Go binary
      uses: actions/download-artifact@v4
      with:
        name: gsa-lsp-linux-amd64
    - name: Verify Go binary
      run: chmod +x gsa-lsp && ./gsa-lsp version
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Compile TypeScript
      run: npm run compile:ts
    - name: Package extension
      run: npx -p @vscode/vsce vsce package
    - name: Upload VSIX Artifact
      if: matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: vsix-build-${{ github.sha }}
        path: "*.vsix"
        retention-days: 7
